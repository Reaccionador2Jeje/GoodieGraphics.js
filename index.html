<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>GoodieGraphics.js — Delicious 3D</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: system-ui, sans-serif; background: #b9ddff; }
      canvas { display: block; }
      .label { position: fixed; top: 16px; left: 16px; padding: 10px 14px; border-radius: 14px; color: white; background: #101827dd; backdrop-filter: blur(8px); }
      .label strong { display: block; font-size: 15px; }
      .label span { font-size: 12px; opacity: .75; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="label"><strong>🍰 GoodieGraphics.js</strong><span>Make the Web 3D Delicious.</span></div>
    <script type="module" src="/examples/showcase.js"></script>
  </body>
</html>
